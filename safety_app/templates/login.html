{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card fade-in" style="max-width:440px;margin:40px auto">
  <div class="eyebrow">Welcome back</div>
  <h2>Sign in to VoltSafe</h2>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email <input type="email" name="email" required autocomplete="email" value="{{ request.form.email }}"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary" type="submit">Sign in</button>
    <p class="muted" style="margin:0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</div>
{% endblock %}
